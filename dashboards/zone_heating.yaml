# =============================================================================
# Zone Heating — example Lovelace dashboard
# =============================================================================
#
# This is an EXAMPLE, not part of the integration: standard `thermostat` cards
# plus a per-zone settings section with the loose helper entities, and
# deliberately no custom card.
#
# Install — two ways:
#
#   1) Quick try (recommended):
#      Settings → Dashboards → "+ Add dashboard" → "New dashboard from scratch"
#      → open it → menu (top-right, ⋮) → "Raw configuration editor" → paste the
#      full contents of this file (from `title:` below) and save.
#
#   2) As a YAML dashboard, in `configuration.yaml`:
#
#        lovelace:
#          mode: storage          # existing UI dashboards keep working
#          dashboards:
#            zone-heating:
#              mode: yaml
#              title: Heating
#              icon: mdi:radiator
#              filename: dashboards/zone_heating.yaml
#              show_in_sidebar: true
#
#      Note: a YAML dashboard loads exactly THIS file; it appears after a restart
#      (or "Reload YAML" → Lovelace).
#
# -----------------------------------------------------------------------------
# ZONES ARE DYNAMIC
# -----------------------------------------------------------------------------
# The integration has NO fixed zones. You add each zone through the config/
# options flow; Home Assistant derives the per-zone entity ids from the ZONE NAME
# (the zone device's object_id). A zone "Living room" therefore yields:
#
#     climate.living_room
#     number.living_room_away_temp / _standby_temp / _active_temp / _boost_temp
#     sensor.living_room_control_source / _override_ends
#     binary_sensor.living_room_present / _window_open   (only if a source is set)
#
# The GLOBAL entities have fixed names (select.heating_mode, the number.heating_*
# and the binary_sensor.heating_*) — they appear once at the top.
#
# Below are two example zones (woonkamer, keuken) to make replication clear.
# TO ADD ANOTHER ZONE:
#   1. Copy one whole `horizontal_stack` block from the `cards:` list below.
#   2. Replace the zone part of every entity id (e.g. `woonkamer` → `slaapkamer`).
#      Spaces and capitals become lowercase-with-underscores in an entity id
#      ("Spare room" → `spare_room`). Settings → Entities shows the exact id.
#   3. If the zone has no schedule helpers (they are optional, see below), drop
#      those `schedule.*` rows.
# =============================================================================

title: Heating
views:
  - title: Heating
    path: heating
    icon: mdi:radiator
    cards:
      # -----------------------------------------------------------------------
      # GLOBAL SECTION — fixed entity ids, once for the whole house.
      # select = master mode; the number.heating_* are the global knobs;
      # the binary_sensor.heating_* are read-only status.
      # -----------------------------------------------------------------------
      - type: entities
        title: Heating — global
        show_header_toggle: false
        state_color: true
        entities:
          - entity: select.heating_mode
            name: Master mode (Managed / Fallback / Off)
          - type: section
            label: Boost & override
          # The boost temperature is per zone (see each zone card); only the
          # boost duration and override timeout are global.
          - entity: number.heating_boost_duration
            name: Boost duration
          - entity: number.heating_override_timeout
            name: Override timeout
          - type: section
            label: Status (read-only)
          - entity: binary_sensor.heating_home_present
            name: Someone home
          - entity: binary_sensor.heating_in_fallback
            name: In fallback

      # =======================================================================
      # ZONE: woonkamer  (template — copy this whole block per extra zone)
      # =======================================================================
      - type: horizontal_stack
        cards:
          # --- Daily control: standard thermostat card -----------------------
          - type: thermostat
            entity: climate.woonkamer
            name: Woonkamer
            features:
              - type: climate-hvac-modes
                hvac_modes:
                  - 'off'
                  - heat
                  - auto
              - type: climate-preset-modes
                style: dropdown
                preset_modes:
                  - away
                  - eco
                  - comfort
                  - boost
          # --- Settings: the daily knobs + read-only status ------------------
          - type: entities
            title: Woonkamer — settings
            show_header_toggle: false
            state_color: true
            # Grouped per stand (order away -> standby -> active -> boost): the
            # temperature and, where applicable, the optional schedule together.
            # Schedule helpers are OPTIONAL (only if you create them and link them
            # to the zone); if this zone has none, drop that row.
            entities:
              - type: section
                label: Away
              - entity: number.woonkamer_away_temp
                name: Temperature
              - type: section
                label: Standby
              - entity: number.woonkamer_standby_temp
                name: Temperature
              - entity: schedule.woonkamer_standby_schedule
                name: Schedule (optional)
              - type: section
                label: Active
              - entity: number.woonkamer_active_temp
                name: Temperature
              - entity: schedule.woonkamer_active_schedule
                name: Schedule (optional, gates Active)
              - type: section
                label: Boost
              - entity: number.woonkamer_boost_temp
                name: Temperature
              - type: section
                label: Status (read-only)
              - entity: sensor.woonkamer_override_ends
                name: Override ends
              - entity: sensor.woonkamer_control_source
                name: Source (HA overlay / Tado schedule)
              - entity: binary_sensor.woonkamer_present
                name: Present
              - entity: binary_sensor.woonkamer_window_open
                name: Window open

      # =======================================================================
      # ZONE: keuken  (second example — same block, different zone id)
      # This example zone has NO schedule helpers, so the `schedule.*` rows are
      # left out.
      # =======================================================================
      - type: horizontal_stack
        cards:
          - type: thermostat
            entity: climate.keuken
            name: Keuken
            features:
              - type: climate-hvac-modes
                hvac_modes:
                  - 'off'
                  - heat
                  - auto
              - type: climate-preset-modes
                style: dropdown
                preset_modes:
                  - away
                  - eco
                  - comfort
                  - boost
          - type: entities
            title: Keuken — settings
            show_header_toggle: false
            state_color: true
            # Same per-stand order; this zone has no schedule helpers, so only
            # the temperature per stand.
            entities:
              - type: section
                label: Away
              - entity: number.keuken_away_temp
                name: Temperature
              - type: section
                label: Standby
              - entity: number.keuken_standby_temp
                name: Temperature
              - type: section
                label: Active
              - entity: number.keuken_active_temp
                name: Temperature
              - type: section
                label: Boost
              - entity: number.keuken_boost_temp
                name: Temperature
              - type: section
                label: Status (read-only)
              - entity: sensor.keuken_override_ends
                name: Override ends
              - entity: sensor.keuken_control_source
                name: Source (HA overlay / Tado schedule)
              - entity: binary_sensor.keuken_present
                name: Present
              - entity: binary_sensor.keuken_window_open
                name: Window open
